<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartman</title>
    <link rel="stylesheet" href="style.css"
</head>
    <body>
        <header class= "title">
            <h1>the Cartman globe</h1>
        <p class="tagline">shake it for a little message</p>
        </header>
        <main>
            <section class ="globe-card">
                <div class="globe" id="globe">
                    <img class="scene" src ="cartman.png" alt="Eric Cartman with a white background" />
                </div>
                <button id="shake">shake the globe</button>
                <p class="message" id="message">press the button and see what shows</p>
            </section>
        </main>
        </footer>
            <p> made by Afreh, in her quaint bedroom</p>
        </footer>
    </body>
</html>
